[package]
name = "isle-native"
version = "0.1.0"
edition = "2021"
description = "Native Rust island: Direct2D, one layered window, no runtime"

[[bin]]
name = "isle"
path = "src/main.rs"

[dependencies]
windows = { version = "0.58", features = [
    "Foundation",
    "Foundation_Collections",
    "Foundation_Numerics",
    "Graphics_Imaging",
    "Media",
    "Media_Control",
    "Storage_Streams",
    "UI_Notifications",
    "UI_Notifications_Management",
    "Web_Http",
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Power",
    "Win32_System_SystemInformation",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The footprint still holds with "3" + fat LTO + one codegen unit, but "z"
# throttled the per-frame paint the springs and equalizer run every tick.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
