name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native island (Rust)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: isle-native
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            isle-native/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('isle-native/Cargo.lock', 'isle-native/Cargo.toml') }}

      - name: Format check
        run: cargo fmt --check

      # Advisory for now: the port carries pre-existing style lints, so this
      # surfaces regressions without turning the whole tree red on unrelated
      # nits. Errors still fail the step.
      - name: Clippy
        run: cargo clippy --all-targets

      - name: Tests
        run: cargo test

      # The footprint and the render loop both depend on the release profile,
      # so the shipped binary is built here too.
      - name: Release build
        run: cargo build --release
